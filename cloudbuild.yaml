  #       "--push",
  #       "-f",
  #       "frontend/dockerfile",
  #       "frontend",
  #     ]

  # Build infinite-talk-server image
  - name: "gcr.io/cloud-builders/docker"
    args:
      [
        "buildx",
        "build",
        "--platform=linux/amd64",
        "--tag=ellliotcarery/infinite-talk-server:$INFINITE_TALK_SERVER_TAG",
        "--push",
        "-f",
        "backend/servers/infinite_talk/dockerfile",
        "backend/servers/infinite_talk",
      ]

# Configure secrets
availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/docker-username/versions/latest
      env: "DOCKER_USERNAME"
    - versionName: projects/$PROJECT_ID/secrets/docker-password/versions/latest
      env: "DOCKER_PASSWORD"

options:
  machineType: "E2_HIGHCPU_8"
  diskSizeGb: 200
  logging: CLOUD_LOGGING_ONLY

