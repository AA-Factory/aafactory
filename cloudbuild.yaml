steps:
  # Setup buildx for multi-platform
  - name: 'gcr.io/cloud-builders/docker'
    args: ['buildx', 'create', '--name', 'multiplatform', '--use']
  
  # Login to Docker Hub
  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    args:
    - '-c'
    - 'docker login -u $$DOCKER_USERNAME -p $$DOCKER_PASSWORD'
    secretEnv: ['DOCKER_USERNAME', 'DOCKER_PASSWORD']
  
  # Build and push for linux/amd64
  - name: 'gcr.io/cloud-builders/docker'
    args: ['buildx', 'build', '--platform', 'linux/amd64', '--push', '-t', 'elliotcarery/aafactory-server:2.6', '.']
    dir: 'backend'

# Configure secrets
availableSecrets:
  secretManager:
  - versionName: projects/$PROJECT_ID/secrets/docker-username/versions/latest
    env: 'DOCKER_USERNAME'
  - versionName: projects/$PROJECT_ID/secrets/docker-password/versions/latest
    env: 'DOCKER_PASSWORD'

options:
  machineType: 'E2_HIGHCPU_8'  # Use larger machine for faster builds
  diskSizeGb: 100  # Increase disk size for large builds
  logging: CLOUD_LOGGING_ONLY
  
serviceAccount: 'projects/caramel-duality-382403/serviceAccounts/techlistpair@caramel-duality-382403.iam.gserviceaccount.com'