  #     [
  #       "buildx",
  #       "build",
  #       "--platform=linux/amd64",
  #       "--tag=ellliotcarery/celery-worker:$COMMIT_SHA",
  #       "--push",
  #       "-f",
  #       "backend/Dockerfile",
  #       "backend",
  #     ]

  # # Build frontend-app image
  # - name: "gcr.io/cloud-builders/docker"
  #   args:
  #     [
  #       "buildx",
  #       "build",
  #       "--platform=linux/amd64",
